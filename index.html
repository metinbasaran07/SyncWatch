<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineSync - Ortak Film İzleme & Video Senkronizasyonu</title>
    <meta name="description" content="Arkadaşlarınızla YouTube, Netflix ve film sitelerinden eşzamanlı video izleyin. WebRTC kamera, bas-konuş ses ve uçtan uca şifreli oda sistemi." />
    <meta property="og:title" content="CineSync - Ortak Film İzleme & Video Senkronizasyonu" />
    <meta property="og:description" content="Arkadaşlarınızla YouTube, Netflix ve film sitelerinden eşzamanlı video izleyin. WebRTC kamera, bas-konuş ses ve uçtan uca şifreli oda sistemi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Runtime Environment: HMR disabled in AI Studio; ignore harmless Vite HMR websocket errors
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason && (reason.message || String(reason));
        var stack = reason && (reason.stack || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite') ||
          stack.includes('@vite/client') ||
          stack.includes('client.mjs')
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = event.message || '';
        var filename = event.filename || '';
        if (
          filename.includes('@vite/client') ||
          filename.includes('client.mjs') ||
          msg.includes('WebSocket') ||
          msg.includes('vite')
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      });
    </script>
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased selection:bg-rose-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
